<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111d35" />
  <meta name="description" content="WortMeister B2 — مدربك الذكي للمفردات الألمانية والاستعداد لـ ECL B2." />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="stylesheet" href="/styles.css" />
  <title>WortMeister B2</title>
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div class="brand-lockup"><div class="brand-mark">W</div><div><div class="brand-name">WortMeister <span>B2</span></div><div class="brand-sub">DEUTSCH · AKTIVE ERINNERUNG</div></div></div>
      <div class="top-actions"><span id="cloud-status" class="sync-pill"><i></i> محلياً على هذا الجهاز</span><button id="theme-toggle" class="icon-btn" aria-label="تبديل المظهر">◐</button><button id="profile-btn" class="profile-btn" aria-label="الحساب">G</button></div>
    </header>
    <div class="layout">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-label">مساحة التعلم</div>
        <nav id="side-nav">
          <button data-page="dashboard" class="nav-item active"><b>⌂</b> الرئيسية</button>
          <button data-page="learn" class="nav-item"><b>✦</b> تعلم اليوم</button>
          <button data-page="library" class="nav-item"><b>▤</b> مفرداتي <span id="nav-word-count" class="nav-count">40</span></button>
          <button data-page="review" class="nav-item"><b>◷</b> مركز المراجعة</button>
          <button data-page="ai" class="nav-item"><b>✧</b> WortMeister AI <span class="ai-tag">AI</span></button>
        </nav>
        <div class="sidebar-label second-label">الإعدادات</div>
        <button data-page="settings" class="nav-item"><b>⚙</b> النسخ الاحتياطي والحساب</button>
        <div class="sidebar-note"><span class="note-icon">✦</span><p>تعلّم أقل، استرجع أكثر. خمس كلمات جديدة تكفي لبناء ذاكرة قوية.</p></div>
      </aside>
      <main id="main" class="main-content" tabindex="-1"></main>
    </div>
    <nav class="mobile-nav" id="mobile-nav">
      <button data-page="dashboard" class="active"><b>⌂</b><span>الرئيسية</span></button>
      <button data-page="learn"><b>✦</b><span>تعلم</span></button>
      <button data-page="library"><b>▤</b><span>مفرداتي</span></button>
      <button data-page="review"><b>◷</b><span>مراجعة</span></button>
      <button data-page="ai"><b>✧</b><span>AI</span></button>
    </nav>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="modal-root"></div>
  </div>
  <script src="/config.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
